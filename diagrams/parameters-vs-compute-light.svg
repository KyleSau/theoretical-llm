<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="How many parameters the campus can train" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How many parameters the campus can train</title>
<desc>Log-log chart of model parameters against training compute, with the compute-optimal line, published models, and this plan's pilot, sparse flagship and dense 100-day optimum.</desc>
<rect x="0.5" y="0.5" width="759" height="559" rx="8" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24" y="34" font-size="15" font-weight="600" fill="#0b0b0b">How many parameters the campus can train</text>
<text x="24" y="54" font-size="12" fill="#52514e">A sparse model reaches the 10-trillion data limit inside the compute limit; a dense one stops near 6 trillion.</text>
<line x1="76.0" y1="108" x2="76.0" y2="500" stroke="#e1e0d9" stroke-width="1"/>
<text x="76.0" y="518" font-size="11" fill="#898781" text-anchor="middle">10²³</text>
<line x1="185.3" y1="108" x2="185.3" y2="500" stroke="#e1e0d9" stroke-width="1"/>
<text x="185.3" y="518" font-size="11" fill="#898781" text-anchor="middle">10²⁴</text>
<line x1="294.7" y1="108" x2="294.7" y2="500" stroke="#e1e0d9" stroke-width="1"/>
<text x="294.7" y="518" font-size="11" fill="#898781" text-anchor="middle">10²⁵</text>
<line x1="404.0" y1="108" x2="404.0" y2="500" stroke="#e1e0d9" stroke-width="1"/>
<text x="404.0" y="518" font-size="11" fill="#898781" text-anchor="middle">10²⁶</text>
<line x1="513.3" y1="108" x2="513.3" y2="500" stroke="#e1e0d9" stroke-width="1"/>
<text x="513.3" y="518" font-size="11" fill="#898781" text-anchor="middle">10²⁷</text>
<line x1="622.7" y1="108" x2="622.7" y2="500" stroke="#e1e0d9" stroke-width="1"/>
<text x="622.7" y="518" font-size="11" fill="#898781" text-anchor="middle">10²⁸</text>
<line x1="732.0" y1="108" x2="732.0" y2="500" stroke="#e1e0d9" stroke-width="1"/>
<text x="732.0" y="518" font-size="11" fill="#898781" text-anchor="middle">10²⁹</text>
<line x1="76" y1="500.0" x2="732" y2="500.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="504.0" font-size="11" fill="#898781" text-anchor="end">10B</text>
<line x1="76" y1="402.0" x2="732" y2="402.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="406.0" font-size="11" fill="#898781" text-anchor="end">100B</text>
<line x1="76" y1="304.0" x2="732" y2="304.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="308.0" font-size="11" fill="#898781" text-anchor="end">1T</text>
<line x1="76" y1="206.0" x2="732" y2="206.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="210.0" font-size="11" fill="#898781" text-anchor="end">10T</text>
<line x1="76" y1="108.0" x2="732" y2="108.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="112.0" font-size="11" fill="#898781" text-anchor="end">100T</text>
<line x1="76" y1="500" x2="732" y2="500" stroke="#c3c2b7" stroke-width="1"/>
<line x1="76" y1="108" x2="76" y2="500" stroke="#c3c2b7" stroke-width="1"/>
<text x="404.0" y="544" font-size="12" fill="#52514e" text-anchor="middle">Training compute for the run (FLOPs, log scale)</text>
<text transform="translate(20,304.0) rotate(-90)" font-size="12" fill="#52514e" text-anchor="middle">Parameters (log scale)</text>
<line x1="76.0" y1="456.5" x2="732.0" y2="162.5" stroke="#898781" stroke-width="2" stroke-linecap="round"/>
<line x1="76" y1="206.0" x2="732" y2="206.0" stroke="#2a78d6" stroke-width="1" opacity="0.55"/>
<line x1="587.4" y1="108" x2="587.4" y2="500" stroke="#2a78d6" stroke-width="1" opacity="0.55"/>
<text x="84" y="199.0" font-size="11" fill="#52514e">Data limit: about 216T tokens supports about 10T parameters</text>
<text transform="translate(601.4,492) rotate(-90)" font-size="11" fill="#52514e">Compute limit: 100 days of the full campus</text>
<circle cx="130.3" cy="378.2" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"/>
<text x="139.3" y="382.2" font-size="11" fill="#52514e" text-anchor="start">GPT-3</text>
<circle cx="159.1" cy="417.2" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"/>
<text x="169.1" y="431.2" font-size="11" fill="#52514e" text-anchor="start">Chinchilla</text>
<line x1="242.0" y1="321.0" x2="242.0" y2="444.3" stroke="#898781" stroke-width="2"/>
<circle cx="242.0" cy="444.3" r="4" fill="#fcfcfb" stroke="#898781" stroke-width="2"/>
<circle cx="242.0" cy="321.0" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"/>
<text x="232.0" y="325.0" font-size="11" fill="#52514e" text-anchor="end">DeepSeek-V3</text>
<line x1="304.9" y1="304.0" x2="304.9" y2="429.8" stroke="#898781" stroke-width="2"/>
<circle cx="304.9" cy="429.8" r="4" fill="#fcfcfb" stroke="#898781" stroke-width="2"/>
<circle cx="304.9" cy="304.0" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"/>
<text x="294.9" y="296.0" font-size="11" fill="#52514e" text-anchor="end">Mistral Large 4</text>
<line x1="336.2" y1="260.2" x2="336.2" y2="411.5" stroke="#898781" stroke-width="2"/>
<circle cx="336.2" cy="411.5" r="4" fill="#fcfcfb" stroke="#898781" stroke-width="2"/>
<circle cx="336.2" cy="260.2" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"/>
<text x="326.2" y="252.2" font-size="11" fill="#52514e" text-anchor="end">MAI-Base-2, 2.8T</text>
<circle cx="358.1" cy="342.5" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"/>
<text x="368.1" y="356.5" font-size="11" fill="#52514e" text-anchor="start">Llama 3.1 405B</text>
<circle cx="416.4" cy="304.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="427.4" y="319.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Pilot, dense 1T</text>
<line x1="547.6" y1="205.5" x2="547.6" y2="284.3" stroke="#2a78d6" stroke-width="2"/>
<circle cx="547.6" cy="284.3" r="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<circle cx="547.6" cy="205.5" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="535.6" y="239.5" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">Flagship, sparse</text>
<text x="535.6" y="254.5" font-size="11" fill="#52514e" text-anchor="end">10T total, 1.6T active</text>
<circle cx="587.4" cy="227.3" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="599.4" y="243.3" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Dense optimum, 6T</text>
<circle cx="82" cy="72" r="5" fill="#2a78d6"/>
<text x="94" y="76" font-size="11.5" fill="#52514e">This plan</text>
<circle cx="172" cy="72" r="5" fill="#898781"/>
<text x="184" y="76" font-size="11.5" fill="#52514e">Published models</text>
<circle cx="304" cy="72" r="4" fill="#fcfcfb" stroke="#898781" stroke-width="2"/>
<text x="316" y="76" font-size="11.5" fill="#52514e">Hollow marker: parameters active per token (mixture-of-experts)</text>
<line x1="76" y1="90" x2="90" y2="90" stroke="#898781" stroke-width="2" stroke-linecap="round"/>
<text x="98" y="94" font-size="11.5" fill="#52514e">Compute-optimal line: about 20 training tokens per parameter (Hoffmann et al. 2022)</text>
</svg>
